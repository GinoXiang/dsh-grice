# dsh-grice bundle patch: inserts the plugin row into the profile roster.
# The host half (index.js) serves the /dsh-grice/* JSON routes, owns the
# per-session switch state, and contributes the "grice:policy" system-prompt
# section while a session has the switch on. The browser half (exports
# "./client") adds the 格赖斯 switch to the composer toolbar.
- insert:
    - id: dsh-grice
      name: dsh-grice
